# Global status (Log4j internal events)
status = warn
name = PropertiesConfig

# Define the destination (Appenders)
appenders = console, file

# 1. Console Appender Configuration
appender.console.type = Console
appender.console.name = LogToConsole
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# 2. File Appender Configuration (THIS IS WHERE YOU NAME YOUR FILE)
appender.file.type = File
appender.file.name = LogToFile
appender.file.fileName = D:\\intellij projects\\ToDo_App\\src\\main\\resources\\log.txt
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# Set the Root Logger level and attach the appenders
rootLogger.level = debug
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.stdout.ref = LogToConsole
rootLogger.appenderRef.logfile.ref = LogToFile